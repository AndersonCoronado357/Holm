<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/holm.svg?v=4" />
    <!-- viewport-fit=cover: la app llega hasta los bordes y el notch se respeta
         desde el CSS con env(safe-area-inset-*). maximum-scale evita el zoom
         al enfocar un campo en iOS, que descuadra toda la pantalla. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Holm — tu espacio para organizar ideas, proyectos y hábitos." />
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f6" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Holm" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- PNG obligatorio: iOS no rasteriza SVG aquí y pondría una captura de la
         página como icono de la pantalla de inicio. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Holm</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
